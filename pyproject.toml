[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-summary-eval"
version = "0.3.0"
description = "Source-grounded DeepEval evaluations for Zoom meeting summaries"
requires-python = ">=3.11"
dependencies = [
  "deepeval==4.3.2",
  "python-dotenv>=1.2,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
notebooks = ["ipykernel>=6", "jupyterlab>=4"]

[project.scripts]
meeting-eval = "meeting_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:deepeval -p no:rerunfailures"
